<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>卡密管理控制台</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 900px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .header-actions {
            text-align: right;
            margin-bottom: 20px;
        }

        .logout-btn {
            color: #dc3545;
            text-decoration: none;
            font-size: 14px;
        }

        .section {
            margin-bottom: 30px;
            border-bottom: 1px solid #eee;
            padding-bottom: 20px;
        }

        .btn {
            padding: 8px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }

        .btn-primary {
            background: #007bff;
            color: white;
        }

        .btn-primary:hover {
            background: #0056b3;
        }

        .btn-green {
            background: #28a745;
            color: white;
        }

        .btn-red {
            background: #dc3545;
            color: white;
        }

        .btn-sm {
            padding: 4px 8px;
            font-size: 12px;
        }

        input,
        select {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-right: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th,
        td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #f8f9fa;
            color: #666;
            font-weight: 600;
        }

        .card-code {
            font-family: monospace;
            font-size: 16px;
            color: #d63384;
            font-weight: bold;
            background: #fff0f6;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 34px;
            height: 20px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 12px;
            width: 12px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: #2196F3;
        }

        input:checked+.slider:before {
            transform: translateX(14px);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 8px;
            width: 450px;
        }

        .sub-group {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            box-sizing: border-box;
        }

        .hint {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header-actions">
            <span>管理员，您好 | </span>
            <a href="/logout/" class="logout-link">退出登录</a>
        </div>
        <h1>🔑 志愿者卡密管理系统</h1>

        <!-- Add Account Section -->
        <div class="section">
            <h3>1. 志愿者账号库</h3>
            <p style="color:#666; font-size:12px;">这里存的是真实的平台账号</p>
            <button class="btn btn-primary" onclick="openAddUserModal()">+ 添加新账号</button>

            <table>
                <thead>
                    <tr>
                        <th>姓名</th>
                        <th>平台账号</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="account-list"></tbody>
            </table>
        </div>

        <!-- Active Cards Section -->
        <div class="section" style="border:none;">
            <h3>2. 有效卡密管理</h3>
            <p style="color:#666; font-size:12px;">生成的卡密可以绑定一个“学生登录账号”，供学生自己在网页查看。</p>
            <button class="btn btn-green" onclick="refreshData()">↻ 刷新列表</button>
            <table>
                <thead>
                    <tr>
                        <th>关联账号</th>
                        <th>卡密</th>
                        <th>绑定学生账号</th>
                        <th>设备绑定</th>
                        <th>自动续期</th>
                        <th>过期时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="card-list"></tbody>
            </table>
        </div>
    </div>

    <!-- Add User Modal -->
    <div id="userModal" class="modal">
        <div class="modal-content">
            <h3>添加志愿者账号</h3>
            <div class="form-group"><label>备注名称 (如: 张三)</label><input type="text" id="new-name"></div>
            <div class="form-group"><label>平台用户名</label><input type="text" id="new-username"></div>
            <div class="form-group"><label>平台密码</label><input type="text" id="new-password"></div>
            <div style="text-align: right;">
                <button class="btn" onclick="closeModal('userModal')">取消</button>
                <button class="btn btn-primary" onclick="addAccount()">保存</button>
            </div>
        </div>
    </div>

    <!-- Generate Card Modal -->
    <div id="cardModal" class="modal">
        <div class="modal-content">
            <h3>生成临时卡密</h3>
            <p id="target-account-name" style="color:#007bff; font-weight:bold; margin-bottom: 15px;"></p>
            <input type="hidden" id="target-account-id">

            <div class="sub-group">
                <div class="form-group">
                    <label>有效期</label>
                    <select id="card-duration" style="width:100%;">
                        <option value="24" selected>1 天</option>
                        <option value="168">7 天</option>
                        <option value="720">30 天</option>
                        <option value="8760">1 年</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>初始自动续期</label>
                    <input type="checkbox" id="card-auto-renew" style="width:auto;"> <span class="hint">开启后永不过期</span>
                </div>
            </div>

            <div class="sub-group" style="border: 1px dashed #28a745; background: #f0fff4;">
                <div class="form-group">
                    <label>创建学生登录账号 (可选)</label>
                    <span class="hint">如果不填，则仅生成卡密，学生无法登录网页查看。</span>
                </div>
                <div class="form-group">
                    <input type="text" id="student-username" placeholder="学生登录用户名 (选填)">
                </div>
                <div class="form-group">
                    <input type="text" id="student-password" placeholder="学生登录密码 (选填)">
                </div>
            </div>

            <div style="text-align: right;">
                <button class="btn" onclick="closeModal('cardModal')">取消</button>
                <button class="btn btn-green" onclick="generateKey()">生成!</button>
            </div>
        </div>
    </div>

    <script>
        async function refreshData() {
            const res = await fetch('/api/dashboard-data/');
            const data = await res.json();

            // Render Accounts
            document.getElementById('account-list').innerHTML = data.accounts.map(acc => `
            <tr>
                <td>${acc.name}</td>
                <td>${acc.username}</td>
                <td>
                    <button class="btn btn-green btn-sm" onclick="openGenCardModal(${acc.id}, '${acc.name}')">生成卡密</button>
                    <button class="btn btn-red btn-sm" onclick="deleteAccount(${acc.id})">删除</button>
                </td>
            </tr>
        `).join('');

            // Render Cards
            document.getElementById('card-list').innerHTML = data.cards.map(card => `
            <tr>
                <td>${card.account_name}</td>
                <td><span class="card-code" onclick="copy('${card.code}')" style="cursor:pointer;" title="点击复制">${card.code}</span></td>
                <td>${card.student_user ? `<span style="color:blue">👤 ${card.student_user}</span>` : '<span style="color:#999">-</span>'}</td>
                <td>
                    ${card.is_bound
                    ? `<span style="color:green;font-size:12px;">🔒 已绑定</span><br><a href="#" onclick="unbindCard(${card.id})" style="color:red;font-size:11px;">[解绑]</a>`
                    : `<span style="color:#999;font-size:12px;">🔓 未绑定</span>`}
                </td>
                <td>
                    <label class="switch">
                        <input type="checkbox" ${card.auto_renew ? 'checked' : ''} onchange="toggleRenew(${card.id}, this.checked)">
                        <span class="slider"></span>
                    </label>
                </td>
                <td>${card.expiry}</td>
                <td>
                    <button class="btn btn-red btn-sm" onclick="deleteCard(${card.id})">作废</button>
                </td>
            </tr>
        `).join('');
        }

        async function toggleRenew(id, status) {
            await fetch('/api/toggle-renew/', {
                method: 'POST',
                body: JSON.stringify({ id, auto_renew: status })
            });
            refreshData();
        }

        async function unbindCard(id) {
            if (!confirm("确定要解除设备绑定吗？\n解除后，卡密可以在新电脑上使用（第一次使用会再次绑定）。")) return;
            await fetch('/api/unbind-card/', { method: 'POST', body: JSON.stringify({ id }) });
            refreshData();
        }

        async function addAccount() {
            const name = document.getElementById('new-name').value;
            const user = document.getElementById('new-username').value;
            const pass = document.getElementById('new-password').value;
            if (!name || !user || !pass) return alert("请填写完整");
            await fetch('/api/add-account/', { method: 'POST', body: JSON.stringify({ name, username: user, password: pass }) });
            closeModal('userModal'); refreshData();
        }

        async function generateKey() {
            const accountId = document.getElementById('target-account-id').value;
            const hours = document.getElementById('card-duration').value;
            const autoRenew = document.getElementById('card-auto-renew').checked;
            const sUser = document.getElementById('student-username').value;
            const sPass = document.getElementById('student-password').value;

            await fetch('/api/generate-card/', {
                method: 'POST',
                body: JSON.stringify({
                    account_id: accountId, duration_hours: hours, auto_renew: autoRenew,
                    student_user: sUser, student_pass: sPass
                })
            });
            closeModal('cardModal'); refreshData();
        }

        async function deleteAccount(id) { if (confirm("确定删除？")) { await fetch('/api/delete-account/', { method: 'POST', body: JSON.stringify({ id }) }); refreshData(); } }
        async function deleteCard(id) { if (confirm("确定作废？")) { await fetch('/api/delete-card/', { method: 'POST', body: JSON.stringify({ id }) }); refreshData(); } }

        function openAddUserModal() { document.getElementById('userModal').style.display = 'flex'; }
        function openGenCardModal(id, name) {
            document.getElementById('target-account-id').value = id;
            document.getElementById('target-account-name').textContent = "为 " + name + " 生成：";
            document.getElementById('student-username').value = ""; // clear
            document.getElementById('student-password').value = ""; // clear
            document.getElementById('cardModal').style.display = 'flex';
        }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function copy(text) { navigator.clipboard.writeText(text); alert("已复制: " + text); }

        refreshData();
    </script>
</body>

</html>
