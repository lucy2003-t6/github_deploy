<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的卡密</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            padding: 30px;
            text-align: center;
            margin-top: 40px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .status-badge {
            background: #e6fffa;
            color: #2c7a7b;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        .key-display {
            background: #f8fafc;
            border: 2px dashed #cbd5e0;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            position: relative;
        }

        .key-code {
            font-family: monospace;
            font-size: 1.8rem;
            color: #2d3748;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .copy-btn {
            background: #4299e1;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            width: 100%;
            transition: background 0.2s;
        }

        .copy-btn:hover {
            background: #3182ce;
        }

        .logout-link {
            display: block;
            margin-top: 20px;
            color: #718096;
            text-decoration: none;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h3>👏 欢迎, {{ request.user.username }}</h3>
                <span class="status-badge">{% if card.is_valid %}有效{% else %}已过期{% endif %}</span>
            </div>

            <p style="color: #718096; margin-bottom: 2rem;">这是您的专属卡密，请妥善保管。</p>

            <div class="key-display">
                <div class="key-code" id="keyCode">{{ card.code }}</div>
            </div>

            <button class="copy-btn" onclick="copyKey()">📋 复制卡密</button>

            <div style="margin-top: 20px; font-size: 0.9rem; color: #a0aec0;">
                有效期至:
                {% if card.auto_renew %}
                <span style="color: green">🔥 自动续期 (永不过期)</span>
                {% else %}
                {{ card.expiry_time|date:"Y-m-d H:i" }}
                {% endif %}
            </div>

            <a href="/logout/" class="logout-link">退出登录</a>
        </div>
    </div>

    <script>
        function copyKey() {
            const key = document.getElementById('keyCode').innerText;
            navigator.clipboard.writeText(key).then(() => {
                const btn = document.querySelector('.copy-btn');
                const original = btn.innerText;
                btn.innerText = "✅ 复制成功";
                btn.style.background = "#48bb78";
                setTimeout(() => {
                    btn.innerText = original;
                    btn.style.background = "#4299e1";
                }, 2000);
            });
        }
    </script>
</body>

</html>
